<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b170e"/>
      <stop offset="100%" stop-color="#050a06"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#22c55e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular container with gold border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.2"/>

  <!-- Stylized green plant leaf -->
  <g filter="url(#leafShadow)">
    <!-- Central Leaf -->
    <path d="M32 9 C35 18 37 28 32 40 C27 28 29 18 32 9 Z" fill="url(#leafGrad)"/>
    <!-- Top Left Leaf -->
    <path d="M32 40 C25 32 17 21 21 14 C27 18 30 27 32 40 Z" fill="url(#leafGrad)"/>
    <!-- Top Right Leaf -->
    <path d="M32 40 C39 32 47 21 43 14 C37 18 34 27 32 40 Z" fill="url(#leafGrad)"/>
    <!-- Bottom Left Leaf -->
    <path d="M32 41 C23 37 12 30 14 24 C21 26 26 33 32 41 Z" fill="url(#leafGrad)"/>
    <!-- Bottom Right Leaf -->
    <path d="M32 41 C41 37 52 30 50 24 C43 26 38 33 32 41 Z" fill="url(#leafGrad)"/>
    <!-- Stem -->
    <path d="M30.8 40 C31.2 46 31.4 51 32 55 C32.6 51 32.8 46 33.2 40 Z" fill="#166534"/>
  </g>

  <!-- Center sprout accent -->
  <circle cx="32" cy="40.5" r="2.2" fill="url(#goldGrad)"/>
</svg>

